name: Build unsigned MSIX
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.4.1'
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build unsigned MSIX
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./build.ps1 -Task Package -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-msix-${{ inputs.version }}
          path: artifacts/publish/msix/win-x64/**/*
          if-no-files-found: error
