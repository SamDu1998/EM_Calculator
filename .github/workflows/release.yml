name: Windows Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.4.0'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify and publish
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          ./build.ps1 -Task Publish -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: EM-Calculator-win-x64
          path: artifacts/EM-Calculator-*-win-x64.zip
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: EM Calculator ${{ github.event.inputs.version || github.ref_name }}
          files: artifacts/EM-Calculator-*-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.event.inputs.version || github.ref_name, '-') }}
