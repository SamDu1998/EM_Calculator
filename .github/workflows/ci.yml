name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify and package native application
        shell: pwsh
        run: ./build.ps1 -Task Publish
      - uses: actions/upload-artifact@v4
        with:
          name: EM-Calculator-win-x64
          path: artifacts/EM-Calculator-*-win-x64.zip
          if-no-files-found: error
